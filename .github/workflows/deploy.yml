name: Build, validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect Pages URL and base path
        id: pages
        uses: actions/configure-pages@v5
        # On pull requests Pages may not be configured yet; fall back to defaults.
        continue-on-error: true

      - run: npm ci

      - name: Validate content and build
        run: npm run build
        env:
          # Custom domain -> https://knowledge.example.com + "/"
          # Project site  -> https://<user>.github.io + "/<repo>"
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin || 'https://knowledge.example.com' }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}

      - name: Check internal links
        run: npm run check-links
        env:
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}

      - name: Run site tests
        run: npm test
        env:
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
